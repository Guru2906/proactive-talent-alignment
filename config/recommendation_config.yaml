# ============================================================
# RECOMMENDATION ENGINE CONFIG
# Proactive IT Role & Skill Emergence Forecaster
# ============================================================
#
# This file controls all configurable weights and thresholds
# for the personalized role recommendation system.
#
# SCORING FORMULA:
#   final_score = (
#       w_baio_fit         * baio_cosine_similarity      +
#       w_interest         * interest_alignment_score    +
#       w_work_style       * work_style_alignment_score  +
#       w_skill            * skill_alignment_score       +
#       w_future           * future_opportunity_score    +
#       w_emergence        * emergence_signal_score
#   )
#
# ALL weights must sum to 1.0
# ALL component scores are normalized to [0, 1]
#
# Note: emergence_signal is intentionally capped at 0.15 max
# to prevent a high emergence score from dominating rankings
# for all users regardless of their personal fit.
# ============================================================

# ── Component Weights ─────────────────────────────────────
weights:
  # How well the user's BAIO archetype vector aligns with
  # the role's BAIO profile (cosine similarity).
  baio_fit: 0.30

  # Alignment between user's declared interests and
  # the role's domain/category (e.g., AI interest → AI roles).
  interest_alignment: 0.25

  # How well the user's work-style preferences (e.g.,
  # problem-solving style, collaboration preference) match
  # the role's typical environment.
  work_style_alignment: 0.15

  # Jaccard similarity between user's current skills and
  # the role's required skills. Penalized for large gaps.
  skill_alignment: 0.15

  # Normalized 6M/12M demand forecast for the role
  # (from LightGBM Pipeline A + Holt forecasts).
  future_opportunity: 0.10

  # Emergence signal from Pipeline B HDBSCAN discovery
  # (or LightGBM tier for known roles). CAPPED at 0.15 weight
  # so it does NOT dominate personal-fit signals.
  emergence_signal: 0.05

# ── Output Score Definitions ──────────────────────────────
# These are the THREE scores shown to the user for each role.
# They are computed from combinations of the 6 components.
output_scores:
  # Personal Match % = weighted combination of:
  # BAIO fit, interest, work_style
  personal_fit_components:
    baio_fit: 0.50
    interest_alignment: 0.30
    work_style_alignment: 0.20

  # Future Potential % = weighted combination of:
  # future_opportunity, emergence_signal
  future_potential_components:
    future_opportunity: 0.70
    emergence_signal: 0.30

  # Current Readiness % = based solely on skill_alignment
  # (high skills match = ready to start now)
  current_readiness_components:
    skill_alignment: 1.00

# ── BAIO Role Profiles ────────────────────────────────────
# Default BAIO profiles for each role family.
# These are used when a role doesn't have an empirical BAIO
# profile from the original Dataset1.csv.
# Format: [Builder, Analyst, Innovator, Operator]
role_family_baio_profiles:
  "Artificial Intelligence & Machine Learning":
    builder: 0.30
    analyst: 0.35
    innovator: 0.25
    operator: 0.10

  "Data & Analytics":
    builder: 0.15
    analyst: 0.50
    innovator: 0.20
    operator: 0.15

  "Cloud & Infrastructure":
    builder: 0.20
    analyst: 0.20
    innovator: 0.15
    operator: 0.45

  "Security":
    builder: 0.15
    analyst: 0.40
    innovator: 0.20
    operator: 0.25

  "Software Engineering":
    builder: 0.45
    analyst: 0.20
    innovator: 0.25
    operator: 0.10

  "DevOps & Platform Engineering":
    builder: 0.30
    analyst: 0.20
    innovator: 0.15
    operator: 0.35

  "Product & Management":
    builder: 0.10
    analyst: 0.30
    innovator: 0.35
    operator: 0.25

  "Embedded & Hardware":
    builder: 0.40
    analyst: 0.25
    innovator: 0.20
    operator: 0.15

  "default":
    builder: 0.25
    analyst: 0.25
    innovator: 0.25
    operator: 0.25

# ── Interest → Role Category Mapping ─────────────────────
# Used to compute interest_alignment_score.
# User's declared interests are matched against these categories.
interest_category_map:
  "AI / Machine Learning":
    - "Artificial Intelligence & Machine Learning"
  "Data Science / Analytics":
    - "Data & Analytics"
  "Cloud / Infrastructure":
    - "Cloud & Infrastructure"
    - "DevOps & Platform Engineering"
  "Cybersecurity":
    - "Security"
  "Software Engineering":
    - "Software Engineering"
  "DevOps / SRE":
    - "DevOps & Platform Engineering"
    - "Cloud & Infrastructure"
  "Product Management":
    - "Product & Management"
  "Robotics / Hardware":
    - "Embedded & Hardware"
  "Full Stack / Web":
    - "Software Engineering"

# ── Work-Style Tags → Role Family Mapping ────────────────
work_style_map:
  "Build and create systems":
    role_families: ["Software Engineering", "Embedded & Hardware", "Cloud & Infrastructure"]
    boost: 0.3
  "Analyze data and find patterns":
    role_families: ["Data & Analytics", "Artificial Intelligence & Machine Learning"]
    boost: 0.3
  "Research and experiment":
    role_families: ["Artificial Intelligence & Machine Learning"]
    boost: 0.4
  "Operate and maintain reliability":
    role_families: ["DevOps & Platform Engineering", "Cloud & Infrastructure", "Security"]
    boost: 0.3
  "Lead and strategize":
    role_families: ["Product & Management"]
    boost: 0.4
  "Solve security and compliance":
    role_families: ["Security"]
    boost: 0.4

# ── Readiness Tier Thresholds ─────────────────────────────
readiness_tiers:
  high:
    min: 0.70
    label: "High Readiness"
    description: "You have most of the core skills for this role"
  medium:
    min: 0.40
    label: "Moderate Readiness"
    description: "Some skill-building required"
  low:
    min: 0.0
    label: "Development Required"
    description: "Significant upskilling needed — this is a stretch role"

# ── Experience Level Modifiers ────────────────────────────
# These scale the readiness score based on user experience.
# Entry-level users get a slight penalty on readiness;
# senior users get a slight boost.
experience_modifiers:
  "Student / Fresher":
    readiness_scale: 0.80
    future_potential_boost: 0.05
  "0-1 years":
    readiness_scale: 0.85
    future_potential_boost: 0.03
  "1-3 years":
    readiness_scale: 1.00
    future_potential_boost: 0.00
  "3-5 years":
    readiness_scale: 1.10
    future_potential_boost: 0.00
  "5+ years":
    readiness_scale: 1.20
    future_potential_boost: 0.00

# ── Top-N Recommendation Settings ────────────────────────
recommendation:
  top_n: 5
  secondary_n: 5
  min_personal_fit_threshold: 0.10   # below this, role is excluded
  dedup_by_family: false             # if true, max 1 role per family in top-5

# ── Roadmap Stage Ordering ────────────────────────────────
# Skill clusters that define stage ordering in roadmaps.
# Skills in earlier stages are shown first.
roadmap_stage_order:
  - name: "Programming Foundations"
    keywords: ["python", "java", "c++", "javascript", "sql", "git", "linux"]
  - name: "Core Data & Statistics"
    keywords: ["statistics", "data analysis", "pandas", "numpy", "r ", "excel"]
  - name: "Machine Learning Fundamentals"
    keywords: ["machine learning", "scikit-learn", "supervised learning", "deep learning", "tensorflow", "pytorch"]
  - name: "Cloud & Infrastructure"
    keywords: ["aws", "azure", "google cloud", "docker", "kubernetes", "terraform"]
  - name: "Advanced AI / LLMs"
    keywords: ["llm", "langchain", "rag", "vector", "prompt engineering", "generative ai", "agentic"]
  - name: "Domain Specialization"
    keywords: ["mlops", "sre", "devops", "security", "embedded", "robotics", "nlp", "computer vision"]
  - name: "Capstone & Portfolio"
    keywords: ["project", "portfolio", "capstone", "github", "deployment", "production"]
